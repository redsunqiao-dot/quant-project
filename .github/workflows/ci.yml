name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Syntax check entrypoints
        run: |
          python -m compileall -q main.py register_factor.py export_qmt_targets.py export_ptrade_targets.py update_*.py src scripts
      - name: Import smoke (no data required)
        run: |
          python -c "import src; from src.common import utils; from src.common.config import load_config; print('ok')"
      - name: Ruff (src, F/E9; PTrade 云端 API 已 per-file-ignore F821)
        run: |
          ruff check src --select F,E9
      - name: Unit tests
        run: |
          pytest -q tests/
