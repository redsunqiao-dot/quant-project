name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package metadata deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Syntax check entrypoints
        run: |
          python -m compileall -q main.py register_factor.py export_qmt_targets.py export_ptrade_targets.py update_*.py src scripts
      - name: Import smoke (no data required)
        run: |
          python -c "import src; from src.common import utils; print('ok')"
