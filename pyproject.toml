[project]
name = "quant-project"
version = "0.2.0"
description = "A-share multi-factor research, composite backtest, and live target export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.19",
    "backtrader>=1.9.78.123",
    "baostock>=0.9.3",
    "cryptography>=45.0.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.0",
    "mplfinance>=0.12.10b0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "shap>=0.44.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
